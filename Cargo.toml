[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.86"   # slice::get_disjoint_mut

[workspace.dependencies]
sb-shared = { path = "crates/sb-shared" }
sb-ring = { path = "crates/sb-ring" }
sb-pipe = { path = "crates/sb-pipe" }
sb-controller = { path = "crates/sb-controller" }
sb-engine = { path = "crates/sb-engine" }
sb-engine-host = { path = "crates/sb-engine-host" }
postcard = { version = "1.1.3", features = ["use-std"] }
rtrb = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
symphonia = { version = "0.5.5", features = ["mp3"] }   # 0.5: stable API; adds MP3 to the defaults (Vorbis/Ogg, FLAC, WAV, PCM, ADPCM, MKV)
windows = "0.62"
windows-core = "0.62"   # the #[implement] macro for COM callbacks names this crate

[profile.release]
debug = "line-tables-only"   # usable backtraces from release builds

[profile.test]
opt-level = 2   # the DSP and the drift simulations are slow unoptimized
